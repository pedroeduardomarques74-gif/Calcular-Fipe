name: BIGGER PRO - Login Fix V25 Universal Mensagens Estavel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zipalign apksigner python3
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -O apktool.jar

      - name: Reassemble APK
        run: |
          cat biggerpro.apk.part00 biggerpro.apk.part01 > biggerpro.apk
          ls -lh biggerpro.apk

      - name: Decode APK
        run: java -jar apktool.jar d -f biggerpro.apk -o decoded

