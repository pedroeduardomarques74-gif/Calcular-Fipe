      - name: Apply Fire Stick keyboard fix V18 base
        run: |
          cat > patch_firestick_v18_base.py <<'PY'
          from pathlib import Path
          import re

          root = Path('decoded')
          layout = root / 'res' / 'layout' / 'activity_login.xml'
          text = layout.read_text(encoding='utf-8', errors='ignore')

          # Username: explicit NEXT action; password: explicit DONE action. Keep single-line fields.
          def patch_edit(tag, action):
              tag = re.sub(r'\sandroid:imeOptions="[^"]*"', '', tag)
              tag = re.sub(r'\sandroid:singleLine="[^"]*"', '', tag)
              return tag[:-2] + f' android:imeOptions="{action}" android:singleLine="true" />'

          text, n1 = re.subn(r'<EditText\b[^>]*android:id="@id/hax_username"[^>]*/>', lambda m: patch_edit(m.group(0), 'actionNext'), text, count=1)
          text, n2 = re.subn(r'<EditText\b[^>]*android:id="@id/hax_password"[^>]*/>', lambda m: patch_edit(m.group(0), 'actionDone'), text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not patch login fields: username={n1}, password={n2}')
          layout.write_text(text, encoding='utf-8')

          candidates = list(root.glob('smali*/com/andyhax/veeepeeen/ui/login/LoginActivity$4.smali'))
          if not candidates:
              candidates = list(root.glob('smali*/com/andyhax/*/ui/login/LoginActivity$4.smali'))
          if not candidates:
              raise SystemExit('LoginActivity$4.smali not found')
          f = candidates[0]
          smali = f.read_text(encoding='utf-8')
          pattern = re.compile(r'\.method public onEditorAction\(Landroid/widget/TextView;ILandroid/view/KeyEvent;\)Z.*?\.end method', re.S)
          replacement = r'''.method public onEditorAction(Landroid/widget/TextView;ILandroid/view/KeyEvent;)Z
              .locals 7

              const/4 v0, 0x6
              if-eq p2, v0, :close_and_login
              const/4 v0, 0x5
              if-eq p2, v0, :close_and_login
              const/4 v0, 0x0
              return v0

              :close_and_login
              invoke-virtual {p1}, Landroid/view/View;->getWindowToken()Landroid/os/IBinder;
              move-result-object v0

              iget-object v5, p0, Lcom/andyhax/veeepeeen/ui/login/LoginActivity$4;->this$0:Lcom/andyhax/veeepeeen/ui/login/LoginActivity;
              const-string v1, "input_method"
              invoke-virtual {v5, v1}, Landroid/content/Context;->getSystemService(Ljava/lang/String;)Ljava/lang/Object;
              move-result-object v1
              check-cast v1, Landroid/view/inputmethod/InputMethodManager;
              if-eqz v1, :clear_focus
              const/4 v2, 0x0
              invoke-virtual {v1, v0, v2}, Landroid/view/inputmethod/InputMethodManager;->hideSoftInputFromWindow(Landroid/os/IBinder;I)Z

              :clear_focus
              invoke-virtual {p1}, Landroid/view/View;->clearFocus()V

              iget-object v0, p0, Lcom/andyhax/veeepeeen/ui/login/LoginActivity$4;->val$usernameEditText:Landroid/widget/EditText;
              invoke-virtual {v0}, Landroid/widget/EditText;->getText()Landroid/text/Editable;
              move-result-object v0
              invoke-virtual {v0}, Ljava/lang/Object;->toString()Ljava/lang/String;
              move-result-object v3

              iget-object v0, p0, Lcom/andyhax/veeepeeen/ui/login/LoginActivity$4;->val$passwordEditText:Landroid/widget/EditText;
              invoke-virtual {v0}, Landroid/widget/EditText;->getText()Landroid/text/Editable;
              move-result-object v0
              invoke-virtual {v0}, Ljava/lang/Object;->toString()Ljava/lang/String;
              move-result-object v4

              new-instance v0, Lcom/andyhax/veeepeeen/ui/login/LoginActivity$SafeLogin;
              const/4 v1, 0x0
              invoke-direct {v0, v5, v1, v3, v4}, Lcom/andyhax/veeepeeen/ui/login/LoginActivity$SafeLogin;-><init>(Lcom/andyhax/veeepeeen/ui/login/LoginActivity;Landroid/widget/ProgressBar;Ljava/lang/String;Ljava/lang/String;)V

              new-instance v1, Ljava/lang/Thread;
              invoke-direct {v1, v0}, Ljava/lang/Thread;-><init>(Ljava/lang/Runnable;)V
              const-string v0, "BiggerLoginWorker"
              invoke-virtual {v1, v0}, Ljava/lang/Thread;->setName(Ljava/lang/String;)V
              invoke-virtual {v1}, Ljava/lang/Thread;->start()V
              const/4 v0, 0x1
              return v0
          .end method'''
          smali2, n = pattern.subn(replacement, smali, count=1)
          if n != 1:
              raise SystemExit('Editor action method not patched')
          f.write_text(smali2, encoding='utf-8')
          print('Fire Stick V18 base keyboard patch applied:', f)
          PY
          python3 patch_firestick_v18_base.py

