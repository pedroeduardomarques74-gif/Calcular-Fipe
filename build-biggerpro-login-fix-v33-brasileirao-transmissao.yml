      - name: Apply V26 PT-BR interface translation
        run: |
          python3 - <<'PYPTBR'
          from pathlib import Path
          import re

          root = Path('decoded')

          # 1) Strings principais usadas nas telas do aplicativo.
          strings = root / 'res' / 'values' / 'strings.xml'
          s = strings.read_text(encoding='utf-8', errors='ignore')
          string_map = {
              '>Back<': '>Voltar<',
              '>Connected<': '>Conectado<',
              '>No Connection<': '>Sem conexão<',
              '>Playlist<': '>Lista de reprodução<',
              '>Invalid Password<': '>Senha inválida<',
              '>Invalid Username<': '>Usuário inválido<',
              '>Username/Password Incorrect or Account Expired<': '>Usuário ou senha incorretos ou conta expirada<',
              '>Please Wait…<': '>Aguarde um momento...<',
          }
          for a,b in string_map.items():
              s=s.replace(a,b)
          strings.write_text(s, encoding='utf-8')

          # 2) Textos escritos diretamente nos layouts. Fazemos somente substituições exatas
          # para não alterar IDs, URLs, nomes de classes ou lógica.
          layout_map = {
              'android:text="Add Playlist"':'android:text="Adicionar lista"',
              'android:text="Live TV"':'android:text="TV ao vivo"',
              'android:text="Movies"':'android:text="Filmes"',
              'android:text="Series"':'android:text="Séries"',
              'android:text="Search"':'android:text="Pesquisar"',
              'android:text="Add to Fav"':'android:text="Adicionar aos favoritos"',
              'android:text="Playlist is not working."':'android:text="A lista não está funcionando."',
              'android:text="Playlist Expiry Date"':'android:text="Validade da lista"',
              'android:text="Update"':'android:text="Atualizar"',
              'android:text="Settings"':'android:text="Configurações"',
              'android:text="Back"':'android:text="Voltar"',
              'android:text="cancel"':'android:text="Cancelar"',
              'android:text="Cancel"':'android:text="Cancelar"',
              'android:text="retry"':'android:text="Tentar novamente"',
              'android:text="Retry"':'android:text="Tentar novamente"',
              'android:text="ok"':'android:text="OK"',
              'android:text="Live Channels"':'android:text="Canais ao vivo"',
              'android:text="Series Name"':'android:text="Nome da série"',
          }
          for d in [p for p in (root/'res').glob('layout*') if p.is_dir()]:
              for f in d.glob('*.xml'):
                  txt=f.read_text(encoding='utf-8', errors='ignore')
                  old=txt
                  for a,b in layout_map.items():
                      txt=txt.replace(a,b)
                  if txt != old:
                      f.write_text(txt, encoding='utf-8')

          # 3) WordModels concentra vários rótulos dinâmicos que aparecem no Fire Stick/TV Box.
          # Traduzimos apenas valores visuais conhecidos, sem tocar em chaves internas como all_id.
          wm = root / 'smali' / 'com' / 'flextv' / 'livestore' / 'models' / 'WordModels.smali'
          if wm.exists():
              txt=wm.read_text(encoding='utf-8', errors='ignore')
              replacements = {
                  'const-string v0, "Account"':'const-string v0, "Conta"',
                  'const-string v0, "Account is expired"':'const-string v0, "Conta expirada"',
                  'const-string v0, "Add Playlist"':'const-string v0, "Adicionar lista"',
