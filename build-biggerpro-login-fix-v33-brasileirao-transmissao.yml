      - name: Rebuild APK
        run: java -jar apktool.jar b decoded -o biggerpro-v32-unsigned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore biggerpro-v32.keystore \
            -storepass biggerpro123 \
            -keypass biggerpro123 \
            -alias biggerpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Grupo Bigger, OU=Android, O=Grupo Bigger, L=Colatina, ST=ES, C=BR"

      - name: Align and sign
        run: |
          zipalign -f -p 4 biggerpro-v32-unsigned.apk biggerpro-v32-aligned.apk
          apksigner sign \
            --ks biggerpro-v32.keystore \
            --ks-pass pass:biggerpro123 \
            --key-pass pass:biggerpro123 \
            --out BIGGER-PRO-LOGIN-FIX-V33.apk \
            biggerpro-v32-aligned.apk
          apksigner verify --verbose BIGGER-PRO-LOGIN-FIX-V33.apk

      - name: Upload V33 APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-PRO-LOGIN-FIX-V33-APK
          path: BIGGER-PRO-LOGIN-FIX-V33.apk
