name: Assinar APK Xiaomi Compat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Build Tools
        shell: bash
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Localizar APK
        id: apk
        shell: bash
        run: |
          set -e
          APK="$(find . -maxdepth 3 -type f -iname '*.apk' \
            ! -path './output/*' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Nenhum APK encontrado no repositório."
            echo "Envie o APK para a raiz ou para uma pasta como input/."
            exit 1
          fi

          echo "APK encontrado: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Restaurar keystore dos Secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 não configurado."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks

      - name: Preparar APK sem assinatura antiga
        shell: bash
        run: |
          set -e
          mkdir -p work output

          cp "${{ steps.apk.outputs.path }}" work/input.apk

          # Remove somente arquivos de assinatura JAR antigos.
          # Não altera classes.dex, resources.arsc, assets ou bibliotecas nativas.
          zip -d work/input.apk \
            'META-INF/*.RSA' \
            'META-INF/*.DSA' \
            'META-INF/*.EC' \
            'META-INF/*.SF' \
            'META-INF/MANIFEST.MF' || true

      - name: Zipalign
        shell: bash
        run: |
          set -e
          zipalign -f -p 4 work/input.apk work/aligned.apk
          zipalign -c -v 4 work/aligned.apk

      - name: Assinar com v1 + v2 + v3
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Configure todos os Secrets de assinatura."
            exit 1
          fi

          apksigner sign \
            --ks release-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out output/BIGGER-PRO-XIAOMI-SIGNED.apk \
            work/aligned.apk

      - name: Validar assinatura e alinhamento
        shell: bash
        run: |
          set -e

          echo "===== APKSIGNER ====="
          apksigner verify --verbose --print-certs \
            output/BIGGER-PRO-XIAOMI-SIGNED.apk

          echo "===== ZIPALIGN ====="
          zipalign -c -v 4 output/BIGGER-PRO-XIAOMI-SIGNED.apk

          echo "===== SHA256 ====="
          sha256sum output/BIGGER-PRO-XIAOMI-SIGNED.apk

      - name: Enviar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-PRO-XIAOMI-SIGNED
          path: output/BIGGER-PRO-XIAOMI-SIGNED.apk
          if-no-files-found: error
          retention-days: 30
