name: BIGGER AUTO Funcionando v4

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto Android
        id: localizar
        shell: bash
        run: |
          SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname '*BIGGER*AUTO*.zip' | head -n 1)"
            if [ -n "$ZIP" ]; then
              mkdir -p extracted_project
              unzip -o "$ZIP" -d extracted_project
              SETTINGS="$(find extracted_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "project_dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Gerar APK Debug
        working-directory: ${{ steps.localizar.outputs.project_dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-AUTO-FUNCIONANDO-v4-APK
          path: ${{ steps.localizar.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
