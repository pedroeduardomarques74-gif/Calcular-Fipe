name: BIGGER AUTO Premium - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto Android
        id: localizar
        shell: bash
        run: |
          SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle/settings.gradle.kts não encontrado."
            echo "Arquivos existentes:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto localizado em: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Gerar APK Debug
        working-directory: ${{ steps.localizar.outputs.project_dir }}
        env:
          VEHICLE_API_BASE: ${{ secrets.VEHICLE_API_BASE }}
          VEHICLE_API_KEY: ${{ secrets.VEHICLE_API_KEY }}
        shell: bash
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace --info             -PVEHICLE_API_BASE="$VEHICLE_API_BASE"             -PVEHICLE_API_KEY="$VEHICLE_API_KEY"

      - name: Localizar APK
        if: success()
        id: apk
        shell: bash
        run: |
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado após compilação."
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: $APK"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-AUTO-PREMIUM-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
