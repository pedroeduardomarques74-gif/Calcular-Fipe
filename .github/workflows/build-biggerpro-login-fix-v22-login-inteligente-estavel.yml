      - name: Apply V21 PT-BR messages and retry reset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('decoded')
          strings = root / 'res' / 'values' / 'strings.xml'
          t = strings.read_text(encoding='utf-8', errors='ignore')
          replacements = {
              'hax_welcome': 'Aguarde um momento...',
              'hax_invalid_password': 'Senha inválida',
              'hax_invalid_username': 'Usuário inválido',
              'hax_login_failed': 'Usuário ou senha incorretos. Verifique os dados e tente novamente.',
              'request_download': 'Baixando a versão mais recente.',
              'search': 'Pesquisar',
              'previous_channel': 'Canal anterior',
              'trailer': 'Assistir trailer',
              'watch_season': 'Assistir temporada',
              'vod': 'Filmes',
              'series': 'Séries',
          }
          for name, value in replacements.items():
              t = re.sub(r'(<string\s+name="'+re.escape(name)+r'">).*?(</string>)',
                         lambda m: m.group(1)+value+m.group(2), t, flags=re.S)
          strings.write_text(t, encoding='utf-8')

          # Translate any app-visible short English browser-related texts if present in XML.
          # We avoid framework/internal MediaBrowser strings because those are not user-facing.
          for f in root.glob('res/layout*/**/*.xml'):
              try:
                  x = f.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              x = x.replace('Please Wait…', 'Aguarde um momento...')
              x = x.replace('Please Wait...', 'Aguarde um momento...')
              x = x.replace('Invalid Username', 'Usuário inválido')
              x = x.replace('Invalid Password', 'Senha inválida')
              x = x.replace('Username/Password Incorrect or Account Expired', 'Usuário ou senha incorretos ou conta expirada')
              f.write_text(x, encoding='utf-8')

          print('V21 PT-BR messages applied')
          PY

      - name: Rebuild APK
        run: java -jar apktool.jar b decoded -o biggerpro-v20-unsigned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore biggerpro-v20.keystore \
            -storepass biggerpro123 \
            -keypass biggerpro123 \
            -alias biggerpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Grupo Bigger, OU=Android, O=Grupo Bigger, L=Colatina, ST=ES, C=BR"

      - name: Align and sign
        run: |
          zipalign -f -p 4 biggerpro-v20-unsigned.apk biggerpro-v20-aligned.apk
          apksigner sign \
            --ks biggerpro-v20.keystore \
            --ks-pass pass:biggerpro123 \
            --key-pass pass:biggerpro123 \
            --out BIGGER-PRO-LOGIN-FIX-V22.apk \
            biggerpro-v20-aligned.apk
          apksigner verify --verbose BIGGER-PRO-LOGIN-FIX-V22.apk

      - name: Upload V22 APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-PRO-LOGIN-FIX-V22-APK
          path: BIGGER-PRO-LOGIN-FIX-V22.apk
