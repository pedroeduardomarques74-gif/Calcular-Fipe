      - name: Apply V19 wrong-login feedback fix
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re

          root = Path('decoded')

          # Keep the pre-login welcome area blank. Waiting text is injected only by the ENTER action.
          for f in root.glob('res/values*/strings.xml'):
              t = f.read_text(encoding='utf-8', errors='ignore')
              t = re.sub(r'(<string name="hax_welcome">).*?(</string>)', r'\1\2', t, flags=re.S)
              f.write_text(t, encoding='utf-8')

          # Patch LoginResult observer: always stop the spinner when a result arrives;
          # when the server reports an authentication error, show a clear PT-BR message.
          files = list(root.glob('smali*/com/andyhax/*/ui/login/LoginActivity$2.smali'))
          if not files:
              raise SystemExit('LoginActivity$2.smali not found')
          f = files[0]
          s = f.read_text(encoding='utf-8')
          cls = re.search(r'^\.class[^\n]*?(L[^;\s]+LoginActivity\$2;)', s, re.M).group(1)
          base = cls[:-len('LoginActivity$2;')]
          act = base + 'LoginActivity;'
          result = base + 'LoginResult;'

          bridge = f''' .method public bridge synthetic onChanged(Ljava/lang/Object;)V
              .locals 5
              move-object v0, p1
              check-cast v0, {result}

              iget-object v1, p0, {cls}->val$loadingProgressBar:Landroid/widget/ProgressBar;
              if-eqz v1, :v19_check
              const/16 v2, 0x8
              invoke-virtual {{v1, v2}}, Landroid/view/View;->setVisibility(I)V

              :v19_check
              if-eqz v0, :v19_original
              invoke-virtual {{v0}}, {result}->getError()Ljava/lang/Integer;
              move-result-object v3
              if-eqz v3, :v19_original

              iget-object v1, p0, {cls}->this$0:{act}
              const v2, 0x7f0b03de
              invoke-virtual {{v1, v2}}, Landroid/app/Activity;->findViewById(I)Landroid/view/View;
              move-result-object v2
              check-cast v2, Landroid/widget/TextView;
              if-eqz v2, :v19_toast
              const-string v4, "Usuário ou senha incorretos."
              invoke-virtual {{v2, v4}}, Landroid/widget/TextView;->setText(Ljava/lang/CharSequence;)V
              const/4 v4, 0x0
              invoke-virtual {{v2, v4}}, Landroid/view/View;->setVisibility(I)V

              :v19_toast
              const-string v2, "Usuário ou senha incorretos. Verifique os dados e tente novamente."
              const/4 v3, 0x1
              invoke-static {{v1, v2, v3}}, Landroid/widget/Toast;->makeText(Landroid/content/Context;Ljava/lang/CharSequence;I)Landroid/widget/Toast;
              move-result-object v1
              invoke-virtual {{v1}}, Landroid/widget/Toast;->show()V

              :v19_original
              invoke-virtual {{p0, v0}}, {cls}->onChanged({result})V
              return-void
          .end method'''.lstrip()

          p1 = re.compile(r'\.method public bridge native synthetic onChanged\(Ljava/lang/Object;\)V\s*\.end method')
          s2, n = p1.subn(bridge, s, count=1)
          if n != 1:
              p2 = re.compile(r'\.method public bridge synthetic onChanged\(Ljava/lang/Object;\)V.*?\.end method', re.S)
              s2, n = p2.subn(bridge, s, count=1)
          if n != 1:
              raise SystemExit('Could not patch LoginActivity$2 observer bridge')
          f.write_text(s2, encoding='utf-8')

          # Safety timeout: if nothing answers within 30 s, stop the spinner and tell the user to retry.
          click_files = list(root.glob('smali*/com/andyhax/*/ui/login/LoginActivity$5.smali'))
          if not click_files:
              raise SystemExit('LoginActivity$5.smali not found')
          cf = click_files[0]
          cs = cf.read_text(encoding='utf-8')
          ccls = re.search(r'^\.class[^\n]*?(L[^;\s]+LoginActivity\$5;)', cs, re.M).group(1)
          cbase = ccls[:-len('LoginActivity$5;')]
          cact = cbase + 'LoginActivity;'
          timeout = cbase + 'LoginActivity$LoginTimeout;'

          mm = re.search(r'\.method public onClick\(Landroid/view/View;\)V.*?\.end method', cs, re.S)
          if not mm:
              raise SystemExit('Login onClick not found')
          body = mm.group(0)
          if 'LoginActivity$LoginTimeout' not in body:
              anchor = '    invoke-virtual {v1}, Ljava/lang/Thread;->start()V'
              if anchor not in body:
                  raise SystemExit('Thread start anchor not found')
              add = f'''

              new-instance v2, Landroid/os/Handler;
              invoke-static {{}}, Landroid/os/Looper;->getMainLooper()Landroid/os/Looper;
              move-result-object v3
              invoke-direct {{v2, v3}}, Landroid/os/Handler;-><init>(Landroid/os/Looper;)V
              new-instance v3, {timeout}
              iget-object v4, p0, {ccls}->this$0:{cact}
              iget-object v5, p0, {ccls}->val$loadingProgressBar:Landroid/widget/ProgressBar;
              invoke-direct {{v3, v4, v5}}, {timeout}-><init>({cact}Landroid/widget/ProgressBar;)V
              const-wide/16 v4, 0x7530
              invoke-virtual {{v2, v3, v4, v5}}, Landroid/os/Handler;->postDelayed(Ljava/lang/Runnable;J)Z'''
              body = body.replace(anchor, anchor + add, 1)
              cs = cs[:mm.start()] + body + cs[mm.end():]
              cf.write_text(cs, encoding='utf-8')

          tf = cf.parent / 'LoginActivity$LoginTimeout.smali'
          tf.write_text(f'''.class final {timeout}
          .super Ljava/lang/Object;
          .implements Ljava/lang/Runnable;

          .field private final activity:{cact}
          .field private final progress:Landroid/widget/ProgressBar;

          .method public constructor <init>({cact}Landroid/widget/ProgressBar;)V
              .locals 0
              invoke-direct {{p0}}, Ljava/lang/Object;-><init>()V
              iput-object p1, p0, {timeout}->activity:{cact}
              iput-object p2, p0, {timeout}->progress:Landroid/widget/ProgressBar;
              return-void
          .end method

          .method public run()V
              .locals 5
              iget-object v0, p0, {timeout}->progress:Landroid/widget/ProgressBar;
              if-eqz v0, :done
              invoke-virtual {{v0}}, Landroid/view/View;->getVisibility()I
              move-result v1
              if-nez v1, :done
              const/16 v1, 0x8
              invoke-virtual {{v0, v1}}, Landroid/view/View;->setVisibility(I)V

              iget-object v2, p0, {timeout}->activity:{cact}
              invoke-virtual {{v2}}, Landroid/app/Activity;->isFinishing()Z
              move-result v3
              if-nez v3, :done
              const v3, 0x7f0b03de
              invoke-virtual {{v2, v3}}, Landroid/app/Activity;->findViewById(I)Landroid/view/View;
              move-result-object v3
              check-cast v3, Landroid/widget/TextView;
              if-eqz v3, :toast
              const-string v4, "Não foi possível autenticar. Verifique usuário e senha."
              invoke-virtual {{v3, v4}}, Landroid/widget/TextView;->setText(Ljava/lang/CharSequence;)V
              const/4 v4, 0x0
              invoke-virtual {{v3, v4}}, Landroid/view/View;->setVisibility(I)V

              :toast
              const-string v3, "Não foi possível autenticar. Verifique usuário e senha."
              const/4 v4, 0x1
              invoke-static {{v2, v3, v4}}, Landroid/widget/Toast;->makeText(Landroid/content/Context;Ljava/lang/CharSequence;I)Landroid/widget/Toast;
              move-result-object v2
              invoke-virtual {{v2}}, Landroid/widget/Toast;->show()V
              :done
              return-void
          .end method
          ''', encoding='utf-8')

          print('V19 login feedback patch applied')
          PYFIX

