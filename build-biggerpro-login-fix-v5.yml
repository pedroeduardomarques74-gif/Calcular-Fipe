    move-result-object v2
    invoke-virtual {v2}, Ljava/lang/Object;->toString()Ljava/lang/String;
    move-result-object v4

    new-instance v0, Lcom/andyhax/veeepeeeen/ui/login/LoginActivity$SafeLogin;
    iget-object v1, p0, Lcom/andyhax/veeepeeeen/ui/login/LoginActivity$5;->val$loadingProgressBar:Landroid/widget/ProgressBar;
