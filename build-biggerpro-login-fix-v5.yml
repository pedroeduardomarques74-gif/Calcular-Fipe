          if old not in s:
              raise SystemExit('Could not patch LoginActivity$4.onEditorAction')
          editor.write_text(s.replace(old, new, 1), encoding='utf-8')

          safe_login = root / 'smali/com/andyhax/veeepeeeen/ui/login/LoginActivity$SafeLogin.smali'
          safe_login.write_text('''.class final Lcom/andyhax/veeepeeeen/ui/login/LoginActivity$SafeLogin;
