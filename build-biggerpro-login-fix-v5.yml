name: BIGGER PRO - Login Fix V5 Tela de Espera

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zipalign apksigner python3
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -O apktool.jar

      - name: Reassemble APK
        run: |
          cat biggerpro.apk.part00 biggerpro.apk.part01 > biggerpro.apk
          ls -lh biggerpro.apk

      - name: Decode APK
        run: java -jar apktool.jar d -f biggerpro.apk -o decoded

      - name: Apply V5 patch
        run: |
          cat > patch_v5.py <<'PY'
          from pathlib import Path
          import re

          root = Path('decoded')

          manifest = root / 'AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8', errors='ignore')
          if 'android:usesCleartextTraffic=' in text:
              text = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', text)
          else:
              text = text.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          if 'android:networkSecurityConfig=' not in text:
              text = text.replace('<application ', '<application android:networkSecurityConfig="@xml/network_security_config" ', 1)
          manifest.write_text(text, encoding='utf-8')

          xml_dir = root / 'res' / 'xml'
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / 'network_security_config.xml').write_text("""<?xml version=\"1.0\" encoding=\"utf-8\"?>
<network-security-config>
    <base-config cleartextTrafficPermitted=\"true\">
        <trust-anchors>
            <certificates src=\"system\" />
            <certificates src=\"user\" />
        </trust-anchors>
    </base-config>
</network-security-config>
""", encoding='utf-8')

          login_xml = root / 'res' / 'layout' / 'activity_login.xml'
          s = login_xml.read_text(encoding='utf-8', errors='ignore')
          s = s.replace('android:text="MAC"', 'android:text="Aguarde um momento...&#10;Estamos localizando seu servidor.&#10;Isso pode levar alguns segundos."', 1)
          s = s.replace('android:textColor="#ffffffff" android:id="@id/txt_mac"', 'android:textColor="#ffffffff" android:textSize="16.0sp" android:textStyle="bold" android:id="@id/txt_mac"', 1)
          s = s.replace('android:id="@id/txt_mac" android:layout_width="wrap_content" android:layout_height="wrap_content"', 'android:id="@id/txt_mac" android:layout_width="300.0dip" android:layout_height="wrap_content" android:gravity="center" android:textAlignment="center"', 1)
          s = s.replace('<ProgressBar android:layout_gravity="center" android:id="@id/hax_loading" android:visibility="gone"', '<ProgressBar android:layout_gravity="center" android:id="@id/hax_loading" android:visibility="gone" android:indeterminate="true"', 1)
          login_xml.write_text(s, encoding='utf-8')

          live = root / 'smali/androidx/lifecycle/MutableLiveData.smali'
          s = live.read_text(encoding='utf-8')
          pat = re.compile(r'\.method public setValue\(Ljava/lang/Object;\)V.*?\.end method', re.S)
          replacement = '''.method public setValue(Ljava/lang/Object;)V
    .locals 2
    .annotation system Ldalvik/annotation/Signature;
        value = {
            "(TT;)V"
        }
    .end annotation

    invoke-static {}, Landroid/os/Looper;->myLooper()Landroid/os/Looper;
    move-result-object v0
    invoke-static {}, Landroid/os/Looper;->getMainLooper()Landroid/os/Looper;
