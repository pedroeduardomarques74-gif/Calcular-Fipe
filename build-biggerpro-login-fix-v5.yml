          PY
          python3 patch_v5.py

      - name: Rebuild APK
        run: java -jar apktool.jar b decoded -o biggerpro-v5-unsigned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore biggerpro-v5.keystore \
            -storepass biggerpro123 \
            -keypass biggerpro123 \
            -alias biggerpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Grupo Bigger, OU=Android, O=Grupo Bigger, L=Colatina, ST=ES, C=BR"

      - name: Align and sign
        run: |
          zipalign -f -p 4 biggerpro-v5-unsigned.apk biggerpro-v5-aligned.apk
          apksigner sign \
            --ks biggerpro-v5.keystore \
            --ks-pass pass:biggerpro123 \
            --key-pass pass:biggerpro123 \
            --out BIGGER-PRO-LOGIN-FIX-V5.apk \
            biggerpro-v5-aligned.apk
          apksigner verify --verbose BIGGER-PRO-LOGIN-FIX-V5.apk

      - name: Upload V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-PRO-LOGIN-FIX-V5-APK
          path: BIGGER-PRO-LOGIN-FIX-V5.apk
