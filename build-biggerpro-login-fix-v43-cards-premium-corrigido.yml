      - name: Apply V37 sports focus fix - robust
        run: |
          python3 - <<'PYV37'
          from pathlib import Path
          import re

          assets = Path('decoded/assets')

          def patch_today():
              p = assets / 'sports_today.html'
              s = p.read_text(encoding='utf-8', errors='ignore')

              variants = [
                  ("b.addEventListener('click',function(){currentLeague=l;renderLeagueTabs();load()})",
                   "b.addEventListener('click',function(){currentLeague=l;renderLeagueTabs();var a=document.querySelector('#leagueTabs .tab.active');if(a)a.focus();load()})"),
                  ("b.addEventListener('click',function(){currentLeague=l;renderLeagueTabs();var a=document.querySelector('#leagueTabs .tab.active');if(a)a.focus();load()})",
                   "b.addEventListener('click',function(){currentLeague=l;renderLeagueTabs();var a=document.querySelector('#leagueTabs .tab.active');if(a)a.focus();load()})")
              ]
              for old,new in variants:
                  if old in s:
                      s=s.replace(old,new,1)
                      break

              variants2 = [
                  ("b.addEventListener('click',function(){currentOffset=d[0];renderDayTabs();load()})",
                   "b.addEventListener('click',function(){currentOffset=d[0];renderDayTabs();var a=document.querySelector('#dayTabs .day.active');if(a)a.focus();load()})"),
                  ("b.addEventListener('click',function(){currentOffset=d[0];renderDayTabs();var a=document.querySelector('#dayTabs .day.active');if(a)a.focus();load()})",
                   "b.addEventListener('click',function(){currentOffset=d[0];renderDayTabs();var a=document.querySelector('#dayTabs .day.active');if(a)a.focus();load()})")
              ]
              for old,new in variants2:
                  if old in s:
                      s=s.replace(old,new,1)
                      break

              if 'id="biggerBack" type="button"' in s and 'onmousedown="this.blur()"' not in s:
                  s=s.replace('id="biggerBack" type="button"','id="biggerBack" type="button" onmousedown="this.blur()"',1)

              p.write_text(s,encoding='utf-8')

          def patch_simple_tabs(name):
              p = assets / name
              s = p.read_text(encoding='utf-8', errors='ignore')

              # Accept the different handlers produced by previous sports versions.
              patterns = [
                  r"b\.addEventListener\('click',function\(\)\{current=l;document\.querySelectorAll\('\.tab'\)\.forEach\(function\(x\)\{x\.classList\.remove\('active'\)\}\);b\.classList\.add\('active'\);load\(\)\}\)",
                  r"b\.addEventListener\('click',function\(\)\{currentLeague=l;[^}]*?load\(\)\}\)",
                  r"b\.addEventListener\('click',function\(\)\{current=l;[^}]*?load\(\)\}\)"
              ]
              replacement = "b.addEventListener('click',function(){current=l;document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');b.focus();load()})"

              if 'b.focus();load()' not in s:
                  changed=False
                  for pat in patterns:
                      s2,n=re.subn(pat,replacement,s,count=1)
                      if n:
                          s=s2;changed=True;break
                  # If this HTML uses inline buttons instead of generated b handlers, do not fail the build.
                  # The important fix is that VOLTAR must not steal focus.

              if 'id="biggerBack" type="button"' in s and 'onmousedown="this.blur()"' not in s:
                  s=s.replace('id="biggerBack" type="button"','id="biggerBack" type="button" onmousedown="this.blur()"',1)

              # Generic safeguard: after clicking any competition tab, retain focus on that tab.
              safeguard = "document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('.tab');if(t){setTimeout(function(){try{t.focus()}catch(_){ }},0)}});"
              if safeguard not in s:
                  s=s.replace('</script>', safeguard+'\n</script>', 1)

              p.write_text(s,encoding='utf-8')

          patch_today()
          for name in ('sports_table.html','sports_info.html'):
              patch_simple_tabs(name)

          # Validate only invariants that are safe across all previous HTML variants.
          t=(assets/'sports_today.html').read_text(encoding='utf-8',errors='ignore')
          if 'biggerBack' not in t:
              raise SystemExit('V40: sports_today lost back button')
          for name in ('sports_table.html','sports_info.html'):
              x=(assets/name).read_text(encoding='utf-8',errors='ignore')
              if 'biggerBack' not in x:
                  raise SystemExit(f'V40: {name} lost back button')
          print('V40 robust sports focus fix applied successfully')
          PYV37

      - name: Apply V38 sports back button position
        run: |
          python3 - <<'PYV38'
          from pathlib import Path
          import re

          assets = Path('decoded/assets')

          def patch_file(name):
              p = assets / name
              s = p.read_text(encoding='utf-8', errors='ignore')

              back_re = re.compile(r'<button id="biggerBack"[^>]*>.*?</button>', re.I | re.S)
              m = back_re.search(s)
              if not m:
                  raise SystemExit(f'V38: botão VOLTAR não encontrado em {name}')
              back = m.group(0)
              s = back_re.sub('', s, count=1)

              if 'onmousedown="this.blur()"' not in back:
                  back = back.replace('id="biggerBack"', 'id="biggerBack" onmousedown="this.blur()"', 1)

              refresh_re = re.compile(r'(<button class="btn" id="refresh"[^>]*>Atualizar</button>)', re.I)
              rm = refresh_re.search(s)
              if not rm:
                  raise SystemExit(f'V38: botão Atualizar não encontrado em {name}')
              actions = '<div class="header-actions">' + back + rm.group(1) + '</div>'
              s = refresh_re.sub(actions, s, count=1)

              css = '\n.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:nowrap}#biggerBack{position:static!important;top:auto!important;z-index:auto!important;margin:0!important;min-height:48px;padding:12px 16px;white-space:nowrap}.header-actions .btn{margin:0;white-space:nowrap}@media(max-width:700px){.header-actions{gap:6px}#biggerBack,.header-actions .btn{min-height:44px;padding:9px 11px;font-size:13px}}\n'
              if '</style>' in s:
                  s = s.replace('</style>', css + '</style>', 1)
              else:
                  raise SystemExit(f'V38: style não encontrado em {name}')

              p.write_text(s, encoding='utf-8')

              check = p.read_text(encoding='utf-8', errors='ignore')
              if check.count('id="biggerBack"') != 1:
                  raise SystemExit(f'V38: quantidade inválida do botão VOLTAR em {name}')
              if '<div class="header-actions">' not in check:
                  raise SystemExit(f'V38: grupo de ações não criado em {name}')
              if check.find('id="biggerBack"') > check.find('id="refresh"'):
                  raise SystemExit(f'V38: VOLTAR não ficou à esquerda de Atualizar em {name}')

          for file_name in ('sports_today.html', 'sports_table.html', 'sports_info.html'):
              patch_file(file_name)

          print('V38: botão VOLTAR movido para o lado de Atualizar nas 3 telas esportivas')
          PYV38


