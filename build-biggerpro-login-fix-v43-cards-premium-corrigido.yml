      - name: Apply V36 Fire Stick advance fix
        run: |
          cat > patch_v36_firestick_advance.py <<'PY'
          from pathlib import Path
          import re

          root = Path('decoded')
          layout = root / 'res' / 'layout' / 'activity_login.xml'
          text = layout.read_text(encoding='utf-8', errors='ignore')

          def patch_password(tag):
              for attr in ('imeOptions', 'nextFocusForward', 'nextFocusDown', 'singleLine'):
                  tag = re.sub(rf'\sandroid:{attr}="[^"]*"', '', tag)
              return tag[:-2] + ' android:imeOptions="actionDone" android:nextFocusForward="@id/hax_login" android:nextFocusDown="@id/hax_login" android:singleLine="true" />'

          text, n = re.subn(r'<EditText\b[^>]*android:id="@id/hax_password"[^>]*/>', lambda m: patch_password(m.group(0)), text, count=1)
          if n != 1:
              raise SystemExit('V36: password field not found')
          layout.write_text(text, encoding='utf-8')

          candidates = list(root.glob('smali*/com/andyhax/veeepeeeen/ui/login/LoginActivity$4.smali'))
          if not candidates:
              candidates = list(root.glob('smali*/com/andyhax/*/ui/login/LoginActivity$4.smali'))
          if not candidates:
              raise SystemExit('V36: LoginActivity$4.smali not found')

          f = candidates[0]
          smali = f.read_text(encoding='utf-8')
          pattern = re.compile(r'\.method public onEditorAction\(Landroid/widget/TextView;ILandroid/view/KeyEvent;\)Z.*?\.end method', re.S)
          replacement = r'''.method public onEditorAction(Landroid/widget/TextView;ILandroid/view/KeyEvent;)Z
              .locals 5

              const/4 v0, 0x5
              if-eq p2, v0, :finish_typing
              const/4 v0, 0x6
              if-eq p2, v0, :finish_typing

              if-eqz p3, :not_handled
              invoke-virtual {p3}, Landroid/view/KeyEvent;->getKeyCode()I
              move-result v0
              const/16 v1, 0x42
              if-ne v0, v1, :not_handled

              :finish_typing
              invoke-virtual {p1}, Landroid/view/View;->getWindowToken()Landroid/os/IBinder;
              move-result-object v0
              iget-object v1, p0, Lcom/andyhax/veeepeeeen/ui/login/LoginActivity$4;->this$0:Lcom/andyhax/veeepeeeen/ui/login/LoginActivity;
              const-string v2, "input_method"
              invoke-virtual {v1, v2}, Landroid/content/Context;->getSystemService(Ljava/lang/String;)Ljava/lang/Object;
              move-result-object v2
              check-cast v2, Landroid/view/inputmethod/InputMethodManager;
              if-eqz v2, :move_focus
              const/4 v3, 0x0
              invoke-virtual {v2, v0, v3}, Landroid/view/inputmethod/InputMethodManager;->hideSoftInputFromWindow(Landroid/os/IBinder;I)Z

              :move_focus
              const/4 v0, 0x2
              invoke-virtual {p1, v0}, Landroid/view/View;->focusSearch(I)Landroid/view/View;
              move-result-object v0
              if-eqz v0, :clear_only
              invoke-virtual {v0}, Landroid/view/View;->requestFocus()Z
              goto :handled

              :clear_only
              invoke-virtual {p1}, Landroid/view/View;->clearFocus()V

              :handled
              const/4 v0, 0x1
              return v0

              :not_handled
              const/4 v0, 0x0
              return v0
          .end method'''

          smali2, count = pattern.subn(replacement, smali, count=1)
          if count != 1:
              raise SystemExit('V36: editor action method not patched')
          f.write_text(smali2, encoding='utf-8')
          print('V36 Fire Stick advance fix applied:', f)
          PY
