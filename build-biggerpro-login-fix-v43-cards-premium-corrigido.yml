          cat > patch_cards_v43.py <<'PYV43'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('decoded')
          ANDROID = 'http://schemas.android.com/apk/res/android'
          A = lambda n: '{%s}%s' % (ANDROID, n)

          # Patch by stable view IDs instead of visible text. This avoids failures when
          # labels are populated dynamically or translated at runtime.
          cards = {
              '@id/ly_live':   ('card_canais',      '@id/image_live',   '@id/txt_live'),
              '@id/ly_movie':  ('card_filmes',      '@id/image_movie',  '@id/txt_movie'),
              '@id/ly_series': ('card_series',      '@id/image_series', '@id/txt_series'),
              '@id/ly_account':('card_esporte',     '@id/image_account','@id/txt_account'),
              '@id/ly_change': ('card_mudar_lista', '@id/image_change', '@id/txt_change'),
          }

          counts = {k:0 for k in cards}
          touched=[]
          for xmlf in sorted((root/'res'/'layout').glob('activity_home*.xml')):
              try:
                  tree=ET.parse(xmlf)
              except Exception:
                  continue
              xr=tree.getroot()
              changed=False
              by_id={el.get(A('id')):el for el in xr.iter() if el.get(A('id'))}

              for card_id,(drawable,image_id,text_id) in cards.items():
                  card=by_id.get(card_id)
                  if card is None:
                      continue
                  card.set(A('background'),'@drawable/'+drawable)
                  # Keep the exact existing card dimensions/position/focus/click behavior.
                  img=by_id.get(image_id)
                  if img is not None:
                      img.set(A('visibility'),'gone')
                  txt=by_id.get(text_id)
                  if txt is not None:
                      txt.set(A('textColor'),'#FFFFFFFF')
                      txt.set(A('shadowColor'),'#CC000000')
                      txt.set(A('shadowDx'),'0')
                      txt.set(A('shadowDy'),'2')
                      txt.set(A('shadowRadius'),'4')
                      txt.set(A('visibility'),'visible')
                      # Center label in lower area without changing the card size.
                      txt.set(A('gravity'),'center')
                  counts[card_id]+=1
                  changed=True

              if changed:
                  ET.register_namespace('android',ANDROID)
                  ET.register_namespace('app','http://schemas.android.com/apk/res-auto')
                  tree.write(xmlf,encoding='utf-8',xml_declaration=True)
                  touched.append(str(xmlf))

          missing=[k for k,v in counts.items() if v==0]
          if missing:
              raise SystemExit('V43: card IDs not found: '+', '.join(missing))
          print('V43 premium cards applied by ID:', counts)
          print('Layouts altered:', touched)
          PYV43

          python3 patch_cards_v43.py

      - name: Apply V41 remove Android top status bar
        run: |
          echo "" | base64 -d > patch_v41.py
          python3 patch_v41.py

      - name: Apply V42 small back button on login
        run: |
          python3 - <<'PYV42'
          from pathlib import Path

          root = Path('decoded')
          layout = root / 'res/layout/activity_login.xml'
          text = layout.read_text(encoding='utf-8', errors='ignore')

          if 'android:onClick="goBackPlaylist"' not in text:
              marker = '    <com.bumptech.glide.load.engine.BackgroundView android:id="@id/image_bg"'
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit('V42: login background marker not found')
              line_end = text.find('/>', idx)
              if line_end < 0:
                  raise SystemExit('V42: login background end not found')
              line_end += 2
              button = '\n    <androidx.appcompat.widget.AppCompatButton android:text="← VOLTAR" android:textColor="#ffffffff" android:textSize="12.0sp" android:textStyle="bold" android:focusable="true" android:focusableInTouchMode="true" android:onClick="goBackPlaylist" android:background="@drawable/btn_reload_bg" android:layout_width="95.0dip" android:layout_height="42.0dip" android:layout_marginStart="18.0dip" android:layout_marginTop="16.0dip" android:elevation="8.0dip" app:layout_constraintStart_toStartOf="parent" app:layout_constraintTop_toTopOf="parent" />'
              text = text[:line_end] + button + text[line_end:]
              layout.write_text(text, encoding='utf-8')

          smali_candidates = [
              root / 'smali/com/andyhax/veeepeeen/ui/login/LoginActivity.smali',
              root / 'smali_classes2/com/andyhax/veeepeeen/ui/login/LoginActivity.smali',
              root / 'smali_classes3/com/andyhax/veeepeeen/ui/login/LoginActivity.smali',
          ]
          smali = next((p for p in smali_candidates if p.exists()), None)
          if smali is None:
              raise SystemExit('V42: LoginActivity.smali not found')

          code = smali.read_text(encoding='utf-8', errors='ignore')
          if '.method public goBackPlaylist(Landroid/view/View;)V' not in code:
              code += '\n\n.method public goBackPlaylist(Landroid/view/View;)V\n    .locals 0\n\n    invoke-virtual {p0}, Lcom/andyhax/veeepeeen/ui/login/LoginActivity;->finish()V\n\n    return-void\n.end method\n'
              smali.write_text(code, encoding='utf-8')

          print('V42 login back button applied')
          PYV42

      - name: Rebuild APK
        run: java -jar apktool.jar b decoded -o biggerpro-v39-unsigned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore biggerpro-v39.keystore \
            -storepass biggerpro123 \
            -keypass biggerpro123 \
            -alias biggerpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Grupo Bigger, OU=Android, O=Grupo Bigger, L=Colatina, ST=ES, C=BR"

      - name: Align and sign
        run: |
          zipalign -f -p 4 biggerpro-v39-unsigned.apk biggerpro-v39-aligned.apk
          apksigner sign \
            --ks biggerpro-v39.keystore \
            --ks-pass pass:biggerpro123 \
            --key-pass pass:biggerpro123 \
            --out BIGGER-PRO-LOGIN-FIX-V43.apk \
            biggerpro-v39-aligned.apk
          apksigner verify --verbose BIGGER-PRO-LOGIN-FIX-V43.apk

      - name: Upload V43 APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-PRO-LOGIN-FIX-V43-APK
          path: BIGGER-PRO-LOGIN-FIX-V43.apk
