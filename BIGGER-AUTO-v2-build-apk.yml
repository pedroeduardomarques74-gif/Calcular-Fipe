name: Build BIGGER AUTO APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK Debug
        env:
          VEHICLE_API_BASE: ${{ secrets.VEHICLE_API_BASE }}
          VEHICLE_API_KEY: ${{ secrets.VEHICLE_API_KEY }}
        run: |
          gradle assembleDebug --stacktrace \
            -PVEHICLE_API_BASE="$VEHICLE_API_BASE" \
            -PVEHICLE_API_KEY="$VEHICLE_API_KEY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-AUTO-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
