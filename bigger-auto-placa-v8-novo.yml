BIGGER_AUTO_PAYLOAD
          base64 -d "$RUNNER_TEMP/bigger-auto-v8/project.b64" > "$RUNNER_TEMP/bigger-auto-v8/project.zip"
          unzip -o "$RUNNER_TEMP/bigger-auto-v8/project.zip" -d "$RUNNER_TEMP/bigger-auto-v8/project"
          echo "PROJECT=$RUNNER_TEMP/bigger-auto-v8/project" >> "$GITHUB_ENV"

      - name: Confirmar projeto correto
        shell: bash
        run: |
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          grep -q 'CONFIGURAR API GRATUITA / TESTE' "$PROJECT/app/src/main/java/com/grupobigger/biggerauto/MainActivity.java"
          grep -q 'api.datacenterapis.com.br/v1/placa/' "$PROJECT/app/src/main/java/com/grupobigger/biggerauto/MainActivity.java"
          echo "Projeto BIGGER AUTO correto confirmado."

      - name: Gerar APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-AUTO-PLACA-v8-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
