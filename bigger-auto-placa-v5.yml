name: BIGGER AUTO Placa v5

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto
        id: projeto
        shell: bash
        run: |
          SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname '*BIGGER*AUTO*.zip' | head -n 1)"
            if [ -n "$ZIP" ]; then
              mkdir -p projeto_extraido
              unzip -o "$ZIP" -d projeto_extraido
              SETTINGS="$(find projeto_extraido -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "Projeto Android não encontrado."
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Gerar APK
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-AUTO-PLACA-v5-APK
          path: ${{ steps.projeto.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
