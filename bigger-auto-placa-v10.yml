      - name: Confirmar projeto v10
        shell: bash
        run: |
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          grep -q 'VEHICLE_BACKEND_URL' "$PROJECT/app/src/main/java/com/grupobigger/biggerauto/MainActivity.java"
          grep -q '• v10' "$PROJECT/app/src/main/java/com/grupobigger/biggerauto/MainActivity.java"
          echo "Projeto v10 confirmado."

      - name: Gerar APK
        shell: bash
        env:
          VEHICLE_BACKEND_URL: ${{ secrets.VEHICLE_BACKEND_URL }}
        run: |
          cd "$PROJECT"
          gradle :app:assembleDebug --no-daemon --stacktrace             -PVEHICLE_BACKEND_URL="$VEHICLE_BACKEND_URL"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-AUTO-PLACA-v10-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
